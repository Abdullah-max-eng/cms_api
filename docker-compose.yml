version: '3.8'

services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cmsdb
      MYSQL_USER: dbuser

    ports:
      - '3307:3306'

    networks:
      - app-network
    volumes:
      - mysql-data:/var/lib/mysql

  node-app:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: node-app-container
    environment:
      DB_HOST: mysql
      DB_PORT: 3307
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_DATABASE: cmsdb
      AT_SECRET: at-secret
      RT_SECRET: rt-secret
    ports:
      - '3000:3000'
    networks:
      - app-network
    depends_on:
      - mysql

networks:
  app-network:

volumes:
  mysql-data:
